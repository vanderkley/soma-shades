[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soma-shades"
version = "1.3.0"
description = "Control Soma Smart Shades over Bluetooth LE, and bridge them to Home Assistant through MQTT"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Riemer van der Kley" }]
requires-python = ">=3.11"
keywords = ["soma", "smart shades", "blinds", "bluetooth", "ble", "home assistant", "mqtt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "aiomqtt~=2.5",
    "bleak~=1.1",
    "bleak-retry-connector~=4.4",
    "click~=8.2",
    "colorlog~=6.8",
    "platformdirs~=4.3",
    "prettytable~=3.9",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/vanderkley/soma-shades"
Issues = "https://github.com/vanderkley/soma-shades/issues"
Changelog = "https://github.com/vanderkley/soma-shades/blob/main/CHANGELOG.md"

[project.scripts]
soma = "soma_shades.cli:main"

[tool.setuptools.package-data]
soma_shades = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    "SIM105",  # contextlib.suppress is not clearer than try/except/pass
    "ASYNC109",  # the timeout parameters are passed to the Bluetooth stack
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["mosquitto: needs the mosquitto broker binary"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["soma_shades"]
